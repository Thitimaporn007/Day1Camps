<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คลังรูปภาพ</title>
  <style>
    body {
      font-family: "Prompt", sans-serif;
      margin: 0;
      background: #e8f5e9;
      color: #1b5e20;
      text-align: center;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      width: 90%;
      max-width: 800px;
      margin: auto;
    }

    .btn {
      background: #43a047;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover { background: #66bb6a; }

    h2 { color: #1b5e20; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1000px;
      margin: 20px auto 40px auto;
    }

    .item {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .item:hover {
      transform: scale(1.03);
    }

    .item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 10px;
      font-weight: 600;
      font-size: 1em;
      background: #f1f8f4;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <header>
    <button class="btn" onclick="history.back()">ย้อนกลับ</button>
    <h2>คลังรูปภาพ</h2>
    <div></div>
  </header>

  <div class="gallery">
    <div class="item">
      <img src="5.jpg" alt="ภาพที่ 1">
      <div class="caption">ภาพที่ 1</div>
    </div>

    <div class="item">
      <img src="6.jpg" alt="ภาพที่ 2">
      <div class="caption">ภาพที่ 2 </div>
    </div>

    <div class="item">
      <img src="img/7.jpg" alt="ภาพที่ 3">
      <div class="caption">ภาพที่ 3 </div>
    </div>

    <div class="item">
      <img src="8.jpg" alt="ภาพที่ 4">
      <div class="caption">ภาพที่ 4 </div>
    </div>

    <div class="item">
      <img src="9.jpg" alt="ภาพที่ 5">
      <div class="caption">ภาพที่ 5 </div>
    </div>

    <div class="item">

    </div>

    <div class="item">

    </div>

    <div class="item">

    <div class="item">

    <div class="item">

    <div class="item">

    <div class="item">

    <div class="item">

    <div class="item">

</body>
</html>
