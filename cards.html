<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บัตรคำ ชุดที่ 1</title>
  <style>
    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: #f1f8e9;
      color: #1b5e20;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 90%;
      max-width: 700px;
      padding: 20px;
    }

    .btn {
      background: #43a047;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover { background: #66bb6a; }

    .card {
      background: white;
      width: 80%;
      max-width: 500px;
      height: 300px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4em;
      margin: 30px 0;
      text-align: center;
      padding: 20px;
      transition: 0.3s;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    #showAnswerBtn {
      background: #2e7d32;
    }

    #showAnswerBtn:hover {
      background: #4caf50;
    }
  </style>
</head>
<body>
  <header>
    <button class="btn" onclick="history.back()">ย้อนกลับ</button>
    <h2>บัตรคำ ชุดที่ 1</h2>
  </header>

  <div class="card" id="flashcard">คำถามจะอยู่ตรงนี้</div>

  <div class="controls">
    <button class="btn" id="prevBtn">ก่อนหน้า</button>
    <button class="btn" id="showAnswerBtn">ดูคำตอบ</button>
    <button class="btn" id="nextBtn">ถัดไป</button>
  </div>

  <script>
    // 🔹 คำถาม–คำตอบทั้งหมด
    const cards = [
      {
        q: "แก้ไขปัญหาช้างบุกรุกพื้นที่ไรของชาวบ้านอย่างไร",
        a: "สร้างแหล่งอาหาร แหล่งน้ำ แหล่งโป่งกระจาย ๆ ไปทั่วให้ช้าง ตั้งหน่วยลาดตระเวนตรวจสอบ ตั้งหมู่บ้านนำร่องให้ชาวบ้านร่วมมือกันแก้ปัญหา"
      },
      {
        q: "ผืนป่ารอยต่อ 5 จังหวัดมีอะไรบ้าง",
        a: "ระยอง ฉะเชิงเทรา จันทบุรี ชลบุรี สระแก้ว"
      },
      {
        q: "อัตราการไหลของน้ำขึ้นอยู่กับอะไร",
        a: "พื้นที่หน้าตัดและความเร็ว"
      },
      {
        q: "ในอุทยานแห่งชาติเขาชะเมา-เขาวงมีช้างโดยเฉลี่ยกี่ตัว",
        a: "799 ตัว"
      },
      {
        q: "ฉายา “นักบุญแห่งป่า นักฆ่าแห่งพงไพร” ของต้นไทรหมายถึงอะไร",
        a: "ต้นไทรมีผลเป็นอาหารสัตว์ป่ามากมาย แต่ไปเกาะต้นไม้อื่นแย่งอาหารและน้ำจนต้นไม้นั้นตาย"
      },
      {
        q: "ทำไมเมฆในระยองถึงอยู่ต่ำกว่าเมฆที่เชียงใหม่",
        a: "เพราะระยองติดทะเล อากาศชื้นและอุณหภูมิคงที่ ทำให้ถึงจุดอิ่มตัวและกลั่นเป็นเมฆได้เร็วกว่า"
      },
      {
        q: "ป่าพรุวิวัฒนาการมาจากอะไร",
        a: "บึง"
      },
      {
        q: "อะไรทำให้เกิดป่าชายเลน",
        a: "ตะกอนปากแม่น้ำ"
      },
      {
        q: "เรือนยอดหลายชั้นช่วยเรื่องอะไร",
        a: "ช่วยลดแรงกระทบจากน้ำฝน"
      },
      {
        q: "ทางโล่ง ๆ ไว้ให้สำหรับสัตว์เดินเรียกว่าอะไร",
        a: "ทางด่าน"
      },
      {
        q: "หินในลำธารช่วยเรื่องอะไร",
        a: "ช่วยชะลอน้ำ"
      },
      {
        q: "ทำไมต้นไม้ต้องเจริญเติบโตด้วยการทำตัวเองให้สูงก่อนขยายด้านข้างทีหลัง",
        a: "เพราะการสูงก่อนช่วยให้หาแสงได้มากขึ้น ทำให้สร้างอาหารได้มาก ต้นจึงอ้วนและใหญ่ภายหลัง"
      },
      {
        q: "ถ้าอยากเพิ่มดินควรทำอย่างไร",
        a: "เพิ่มน้ำให้พืชเจริญเติบโตจนทิ้งใบ ซากใบจะทับถมกลายเป็นดิน"
      },
      {
        q: "ทำไมฝายในลำปางทำจากไม้ไผ่ แต่ที่ระยองทำจากหิน",
        a: "เพราะลำปางมีต้นไผ่เยอะ ใช้ทรัพยากรธรรมชาติให้คุ้มค่าที่สุด"
      },
      {
        q: "ทำไมเถาวัลย์มีทิศเลื้อยตามเข็ม",
        a: "เพราะเลื้อยตามทิศทางการขึ้นของพระอาทิตย์"
      }
    ];

    let index = 0;
    let showAnswer = false;
    const card = document.getElementById("flashcard");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const showAnswerBtn = document.getElementById("showAnswerBtn");

    function updateCard() {
      card.textContent = showAnswer ? cards[index].a : cards[index].q;
    }

    prevBtn.onclick = () => {
      if (index > 0) {
        index--;
        showAnswer = false;
        updateCard();
      }
    };

    nextBtn.onclick = () => {
      if (index < cards.length - 1) {
        index++;
        showAnswer = false;
        updateCard();
      }
    };

    showAnswerBtn.onclick = () => {
      showAnswer = !showAnswer;
      updateCard();
    };

    // เริ่มต้น
    updateCard();
  </script>
</body>
</html>
